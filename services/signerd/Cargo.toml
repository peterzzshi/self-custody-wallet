[package]
name = "signerd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "signerd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

