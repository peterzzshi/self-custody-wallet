[tool.poetry]
name = "agent"
version = "0.1.0"
description = "Intent → policy → session key → on-chain execute"
authors = ["Peter Shi"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111"
uvicorn = { version = "^0.30", extras = ["standard"] }
pydantic = "^2"
pydantic-settings = "^2"
litellm = "^1"
alembic = "^1"
psycopg = { version = "^3", extras = ["binary"] }
httpx = "^0.27"

[tool.poetry.dev-dependencies]
pytest = "^8"
pytest-asyncio = "^0.23"
ruff = "^0.4"
mypy = "^1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
