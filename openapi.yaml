openapi: "3.1.0"
info:
  title: walletd
  version: "0.1.0"
  description: |
    Self-custody wallet orchestration API. All mutations write an audit event.
    Requests are authenticated with HMAC-SHA256 over (body + timestamp + nonce).

servers:
  - url: http://localhost:8080
    description: local

paths:
  /health:
    get:
      operationId: health
      summary: Liveness and readiness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, signer, store]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        signer:
          type: string
          enum: [ok, down]
        store:
          type: string
          enum: [ok, down]
